<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KuitoInoguchi profile banner</title>
  <desc id="desc">A dark GitHub profile banner about interactive review tools, code, and learning machines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09111F"/>
      <stop offset="0.48" stop-color="#102235"/>
      <stop offset="1" stop-color="#15101F"/>
    </linearGradient>
    <linearGradient id="line" x1="95" y1="234" x2="1065" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="text" x1="150" y1="80" x2="760" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F2FE"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FED7AA"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.2 0 0 0 0 0.75 0 0 0 0 1 0 0 0 0.42 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 H 0 V 36" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .pulse { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
      .float { animation: float 6s ease-in-out infinite; }
      .dash { stroke-dasharray: 12 12; animation: dash 18s linear infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -240; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <circle cx="195" cy="90" r="150" fill="#0EA5E9" fill-opacity="0.16" filter="url(#softGlow)"/>
  <circle cx="965" cy="265" r="180" fill="#F97316" fill-opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="700" cy="30" r="120" fill="#22C55E" fill-opacity="0.11" filter="url(#softGlow)"/>

  <path class="dash" d="M90 238 C260 105 372 284 522 166 C681 42 790 240 939 128 C1008 76 1057 80 1110 116" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity="0.78"/>
  <path d="M88 254 C275 156 344 304 525 220 C694 142 801 296 940 184 C1012 126 1063 138 1112 160" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round"/>

  <g class="pulse">
    <circle cx="176" cy="181" r="9" fill="#38BDF8"/>
    <circle cx="176" cy="181" r="24" stroke="#38BDF8" stroke-opacity="0.28"/>
  </g>
  <g class="pulse">
    <circle cx="522" cy="166" r="8" fill="#22C55E"/>
    <circle cx="522" cy="166" r="23" stroke="#22C55E" stroke-opacity="0.26"/>
  </g>
  <g class="pulse">
    <circle cx="940" cy="128" r="9" fill="#F97316"/>
    <circle cx="940" cy="128" r="24" stroke="#F97316" stroke-opacity="0.3"/>
  </g>

  <g class="float">
    <rect x="760" y="74" width="288" height="182" rx="18" fill="#0D1117" fill-opacity="0.84" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <circle cx="790" cy="104" r="5" fill="#F87171"/>
    <circle cx="810" cy="104" r="5" fill="#FBBF24"/>
    <circle cx="830" cy="104" r="5" fill="#34D399"/>
    <text x="790" y="146" class="mono" font-size="17" fill="#94A3B8">review.generate()</text>
    <text x="790" y="179" class="mono" font-size="17" fill="#E5E7EB">sourceIds.map(link)</text>
    <text x="790" y="212" class="mono" font-size="17" fill="#86EFAC">deploy("gh-pages")</text>
  </g>

  <g>
    <text x="92" y="115" class="sans" font-size="28" font-weight="700" fill="#7DD3FC">KuitoInoguchi</text>
    <text x="90" y="184" class="sans" font-size="58" font-weight="850" fill="url(#text)">Make study clickable.</text>
    <text x="94" y="224" class="sans" font-size="24" fill="#CBD5E1">把学习材料做成交互，把小想法写成可以验证的工具。</text>
    <text x="96" y="276" class="mono" font-size="18" fill="#93C5FD">TypeScript / React / Python / AI practice / learning tools</text>
  </g>

  <g opacity="0.85">
    <rect x="94" y="298" width="142" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="116" y="319" class="mono" font-size="14" fill="#BAE6FD">history review</text>
    <rect x="250" y="298" width="108" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="272" y="319" class="mono" font-size="14" fill="#BBF7D0">notebooks</text>
    <rect x="372" y="298" width="106" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="394" y="319" class="mono" font-size="14" fill="#FED7AA">algorithms</text>
  </g>
</svg>
